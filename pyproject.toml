[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openplane"
version = "0.5.0"
description = "Preliminary and conceptual design application for electric fixed-wing RC aircraft and small UAVs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "scipy>=1.10"]

[project.scripts]
openplane = "openplane.app:main"

[tool.setuptools.packages.find]
include = ["openplane*"]

[tool.setuptools.package-data]
openplane = ["data/**/*.json", "data/**/*.dat"]
